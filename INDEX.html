<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-5 col-md-8">
            <h2 class="text-center mb-4 display-5">Sentiment Analysis</h2>
            <form action="/predict" method="post">
                <div class="mb-3">
                    <label for="review" class="form-label display-6">Enter your review:</label>
                    <textarea class="form-control fs-5" id="review" name="review" rows="7" style="height: 200px;" required></textarea>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Analyze Sentiment</button>
                </div>
            </form>

            {% if prediction %}
                <div class="alert alert-info mt-4 text-center">
                    <strong>Predicted Sentiment:</strong> {{ prediction }}<br>
                    <small><em>Review: "{{ review }}"</em></small>
                </div>
            {% endif %}
            
        </div>
    </div>
</body>
</html>
